services:
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/payrescue.sqlite
      PORT: "8787"
    volumes:
      - payrescue_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  payrescue_data:
